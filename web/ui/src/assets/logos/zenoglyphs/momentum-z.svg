<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- Momentum Z — the same Z route as node-z, but ticked rather than solid:
       the stroke is a run of momenta, with solid caps at the two ends. Reads
       as a ledger advancing in discrete steps. -->
  <defs>
    <linearGradient id="zg-momentum-plasma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(120 86% 63%)" />
      <stop offset="100%" stop-color="hsl(145 100% 38%)" />
    </linearGradient>
  </defs>
  <path
    d="M6,6H18L6,18H18"
    stroke="url(#zg-momentum-plasma)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-dasharray="2.6 2.2"
  />
  <circle cx="6" cy="6" r="1.9" fill="url(#zg-momentum-plasma)" />
  <circle cx="18" cy="18" r="1.9" fill="url(#zg-momentum-plasma)" />
</svg>
