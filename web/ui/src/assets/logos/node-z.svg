<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!-- Node Z — a single-weight Z route between four small nodes. Closer in
       spirit to the design system's network glyphs (a chain concept traced
       as a line) than to the brand marks, but kept in plasma since this is
       the app's own identity rather than a generic network concept. -->
  <defs>
    <linearGradient id="zcribe-node-plasma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(120 86% 63%)" />
      <stop offset="100%" stop-color="hsl(145 100% 38%)" />
    </linearGradient>
  </defs>
  <path
    d="M6,6L18,6L6,18L18,18"
    stroke="url(#zcribe-node-plasma)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="6" cy="6" r="2" fill="url(#zcribe-node-plasma)" />
  <circle cx="18" cy="6" r="1.6" fill="url(#zcribe-node-plasma)" />
  <circle cx="6" cy="18" r="1.6" fill="url(#zcribe-node-plasma)" />
  <circle cx="18" cy="18" r="2" fill="url(#zcribe-node-plasma)" />
</svg>
