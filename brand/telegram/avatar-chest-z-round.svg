<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Round — circular head over a capsule torso. Softer than the square body, and a round head is already the shape the crop wants. -->
  <defs>
    <linearGradient id="plasma" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(120 86% 63%)"/>
      <stop offset="100%" stop-color="hsl(145 100% 38%)"/>
    </linearGradient>
    <radialGradient id="ink" cx="0.5" cy="0.36" r="0.75">
      <stop offset="0%" stop-color="hsl(146 42% 14%)"/>
      <stop offset="62%" stop-color="hsl(150 40% 8%)"/>
      <stop offset="100%" stop-color="hsl(152 38% 4%)"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ink)"/>
  <mask id="cut">
    <rect width="512" height="512" fill="#000"/>
    <circle cx="256" cy="192" r="88" fill="#fff"/>
    <rect x="236" y="272" width="40" height="24" fill="#fff"/>
    <rect x="150" y="288" width="212" height="132" rx="54" fill="#fff"/>
    <rect x="186" y="166" width="140" height="52" rx="26" fill="#000"/>
    <circle cx="214" cy="192" r="15" fill="#fff"/>
    <circle cx="298" cy="192" r="15" fill="#fff"/>
    <rect x="224" y="238" width="64" height="15" rx="7" fill="#000"/>
    <g transform="translate(180,275) scale(6.6)" fill="#000">
      <path d="M4,4H20V8H4ZM20,8L8,16L4,16L16,8ZM4,16H20V20H4Z"/>
    </g>
  </mask>
  <rect width="512" height="512" fill="url(#plasma)" mask="url(#cut)"/>
</svg>
