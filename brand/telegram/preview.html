<!-- Contact sheet for picking one. Open directly in a browser; ./render.sh
     regenerates it along with the PNGs. Every avatar is shown inside the circular crop
     Telegram applies, at the three sizes it actually gets displayed at:
     profile header, chat list, and message author. -->
<meta charset="utf-8">
<title>zcribe — Telegram avatar candidates</title>
<style>
  body { margin:0; padding:32px 40px; background:#14161a; color:#e6ebe8;
         font:14px/1.5 ui-sans-serif,system-ui,sans-serif; }
  h1 { font-size:17px; font-weight:600; margin:0 0 4px; letter-spacing:-.01em; }
  p.sub { margin:0 0 28px; color:#8a9691; font-size:13px; }
  table { border-collapse:collapse; }
  th { font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.08em;
       color:#8a9691; text-align:left; padding:0 22px 12px 0; }
  td { padding:11px 22px 11px 0; vertical-align:middle; border-top:1px solid #23272c; }
  td.name { font-family:ui-monospace,SFMono-Regular,monospace; font-size:12.5px; color:#b9c4bf; }
  img { border-radius:50%; display:block; }
</style>
<h1>zcribe — Telegram avatar candidates</h1>
<p class="sub">Circular crop applied, at the three sizes Telegram renders a bot photo.</p>
<table>
  <tr><th>file</th><th>96 — profile</th><th>48 — chat list</th><th>28 — author</th></tr>
  <tbody id="rows"></tbody>
</table>
<script>
  const names = ["chest-z-plain","chest-z-visor","chest-z-round","chest-z-wide","chest-z-shoulders","chest-z-screen"];
  document.getElementById("rows").innerHTML = names.map(n => `
    <tr><td class="name">avatar-${n}.png</td>
      <td><img src="avatar-${n}.png" width="96" height="96"></td>
      <td><img src="avatar-${n}.png" width="48" height="48"></td>
      <td><img src="avatar-${n}.png" width="28" height="28"></td></tr>`).join("");
</script>
