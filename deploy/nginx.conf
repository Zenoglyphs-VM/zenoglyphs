# zcribe — nginx equivalent of the Caddyfile beside this file.
#
# Certificates are assumed to already exist (certbot, or whatever you use).
# The two server blocks are two origins on purpose: inscribed HTML and SVG
# execute script, so they never share an origin with the API (spec R-8.2).

upstream zcribe_api     { server 127.0.0.1:8710; keepalive 8; }
upstream zcribe_content { server 127.0.0.1:8711; keepalive 8; }

# ---- the API and the viewer -------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name glyphs.zenon.foo;

    ssl_certificate     /etc/letsencrypt/live/glyphs.zenon.foo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/glyphs.zenon.foo/privkey.pem;

    gzip on;
    gzip_types application/json text/css application/javascript text/html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://content.zenon.foo data:; media-src 'self' https://content.zenon.foo; frame-src https://content.zenon.foo; connect-src 'self' https://content.zenon.foo; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'" always;

    # The sync height moves every ten seconds; a cached API response is a
    # stale claim about the chain.
    add_header Cache-Control "no-store" always;

    location / {
        proxy_pass http://zcribe_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---- the content origin -----------------------------------------------------

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name content.zenon.foo;

    ssl_certificate     /etc/letsencrypt/live/content.zenon.foo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/content.zenon.foo/privkey.pem;

    gzip on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Deliberately no add_header Content-Security-Policy here.
    #
    # The indexer builds one per response: it carries the sandbox and pins
    # every fetch directive to this origin. A browser given two CSP headers
    # enforces both, so anything added here would intersect with that policy —
    # silently breaking recursion, or silently loosening the sandbox, depending
    # on which directive was the stricter one.
    #
    # Note also that `add_header` in nginx is not additive across levels: a
    # single add_header in a location block drops every add_header inherited
    # from the server block. Keep this block header-free and the question does
    # not arise.

    location / {
        proxy_pass http://zcribe_content;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Inscribed content is immutable — the id is the block hash — so the
        # origin's own year-long, immutable Cache-Control is correct and must
        # reach the CDN untouched.
        proxy_pass_header Cache-Control;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name glyphs.zenon.foo content.zenon.foo;
    return 301 https://$host$request_uri;
}
